# Publishes the site to GitHub Pages every time a change reaches the main branch.
# For now the site is the plain files in public/. When the Astro build arrives, a build step goes here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
